apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: towers
build:
  # Release version for both images. Bump this for every release.
  tagPolicy:
    envTemplate:
      template: v1.5
  # The cluster has ARM64 nodes; publish both architectures.
  platforms: [linux/amd64, linux/arm64]
  # Context is the repo root because both Dockerfiles COPY shared/.
  artifacts:
    - image: docker.io/bevdev1/towers-client
      docker:
        dockerfile: client/Dockerfile
    - image: docker.io/bevdev1/towers-server
      docker:
        dockerfile: server/Dockerfile
manifests:
  rawYaml:
    - k8s/*.yaml
    - k8s/pocketbase/*.yaml
deploy:
  kubectl:
    hooks:
      before:
        # A finished Job never re-runs; delete it so the schema setup runs each deploy.
        - host:
            command: [kubectl, delete, job, pocketbase-setup, -n, towers, --ignore-not-found]

profiles:
  # skaffold run -p dev  →  :dev images, k8s-dev/ manifests, towers-dev namespace
  - name: dev
    build:
      tagPolicy:
        envTemplate:
          template: dev
    manifests:
      rawYaml:
        - k8s-dev/*.yaml
        - k8s-dev/pocketbase/*.yaml
    deploy:
      kubectl:
        hooks:
          before:
            - host:
                command: [kubectl, delete, job, pocketbase-setup, -n, towers-dev, --ignore-not-found]
